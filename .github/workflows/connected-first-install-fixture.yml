name: Connected first-install synthetic fixture

on:
  pull_request:
    paths:
      - '.github/workflows/connected-first-install-fixture.yml'
      - 'cmd/observer-connected-install/**'
      - 'internal/connectedinstall/**'
      - 'internal/connectedpolicy/**'
      - 'scripts/fixtures/connected-first-install/**'
      - 'specs/012-connected-observation/first-install-transaction.md'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - '.github/workflows/connected-first-install-fixture.yml'
      - 'cmd/observer-connected-install/**'
      - 'internal/connectedinstall/**'
      - 'internal/connectedpolicy/**'
      - 'scripts/fixtures/connected-first-install/**'
      - 'specs/012-connected-observation/first-install-transaction.md'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: connected-first-install-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-root-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Unit, prompt, dependency and receiver contracts
        run: go test ./internal/connectedpolicy ./internal/connectedinstall ./cmd/observer-connected-install ./scripts/fixtures/connected-first-install
      - name: Compile owned temporary-root fixture
        run: go test -c ./internal/connectedinstall -o "$RUNNER_TEMP/connected-first-install.test"
      - name: Prove synthetic role/refusal/fault boundaries only
        run: >-
          sudo env -i PATH=/usr/bin:/bin TMPDIR=/tmp OBSERVER_CONNECTED_INSTALL_LAYOUT_ACCEPTANCE=1
          "$RUNNER_TEMP/connected-first-install.test"
          -test.run='^TestOwnedInstallLayoutFixture$' -test.count=1 -test.timeout=120s -test.v
