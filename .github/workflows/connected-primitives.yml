name: Connected profile primitive acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: connected-primitives-${{ github.ref }}
  cancel-in-progress: true

jobs:
  systemd-primitives:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prove synthetic syscall and empty credential semantics
        run: sudo env -i PATH=/usr/bin:/bin bash scripts/fixtures/connected-primitives/run.sh
