name: Go runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: go test ./...
      - name: Run race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - run: go vet ./...
      - name: Validate real native snapshot against JSON Schema
        run: node scripts/validate-runtime-snapshot.mjs
      - name: Smoke-test the actual local service and history
        run: node scripts/smoke-local-service.mjs

  cross-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-build native binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o build/observer-linux-amd64 ./cmd/observer
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -o build/observer-linux-arm64 ./cmd/observer
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o build/observer-windows-amd64.exe ./cmd/observer
          CGO_ENABLED=0 GOOS=windows GOARCH=arm64 go build -trimpath -o build/observer-windows-arm64.exe ./cmd/observer
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -trimpath -o build/observer-darwin-amd64 ./cmd/observer
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -trimpath -o build/observer-darwin-arm64 ./cmd/observer
