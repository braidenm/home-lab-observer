name: Shared handoff acceptance

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/shared-handoff-acceptance.yml'
      - 'internal/sharedhandoff/**'
      - 'internal/ownerfs/**'
      - 'internal/observation/**'
      - 'internal/remoteprojection/**'
      - 'go.mod'
      - 'go.sum'
      - 'docs/adr/018-shared-read-handoff.md'
      - 'specs/012-connected-observation/shared-handoff.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/shared-handoff-acceptance.yml'
      - 'internal/sharedhandoff/**'
      - 'internal/ownerfs/**'
      - 'internal/observation/**'
      - 'internal/remoteprojection/**'
      - 'go.mod'
      - 'go.sum'
      - 'docs/adr/018-shared-read-handoff.md'
      - 'specs/012-connected-observation/shared-handoff.md'

permissions:
  contents: read

concurrency:
  group: shared-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-dac-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile static owned fixture
        run: go test -c ./internal/sharedhandoff -o "$RUNNER_TEMP/shared-handoff.test"
      - name: Prove distinct-principal DAC and ACL behavior
        run: >-
          sudo env -i PATH=/usr/bin:/bin TMPDIR=/tmp OBSERVER_SHARED_ACCEPTANCE=1
          "$RUNNER_TEMP/shared-handoff.test"
          -test.run='^TestOwnedCrossPrincipalFixture$' -test.count=3 -test.timeout=120s -test.v
