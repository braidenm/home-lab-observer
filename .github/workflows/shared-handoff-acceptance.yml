name: Shared handoff acceptance

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

# This short security-boundary proof is a required merge check. Always report it:
# workflow-level path filtering would leave unrelated PRs waiting for a missing check.

permissions:
  contents: read

concurrency:
  group: shared-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-dac-acl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile static owned fixture
        run: go test -c ./internal/sharedhandoff -o "$RUNNER_TEMP/shared-handoff.test"
      - name: Prove distinct-principal DAC and ACL behavior
        run: >-
          sudo env -i PATH=/usr/bin:/bin TMPDIR=/tmp OBSERVER_SHARED_ACCEPTANCE=1
          "$RUNNER_TEMP/shared-handoff.test"
          -test.run='^TestOwnedCrossPrincipalFixture$' -test.count=3 -test.timeout=120s -test.v
      - name: Compile fixed-reader socket witness fixture
        run: go test -c ./internal/dockerreader -o "$RUNNER_TEMP/docker-reader.test"
      - name: Prove fixed-reader socket replacement refusal
        run: >-
          sudo env -i PATH=/usr/bin:/bin TMPDIR=/tmp OBSERVER_SHARED_ACCEPTANCE=1
          "$RUNNER_TEMP/docker-reader.test"
          -test.run='^TestOwnedSocketWitnessRejectsReplacementAndPermissionDrift$' -test.count=3 -test.timeout=30s -test.v
