name: Dashboard

on:
  pull_request:
    paths:
      - "web/observer-ui/**"
      - "api/**"
      - "schemas/**"
      - "specs/004-reusable-dashboard/**"
      - ".github/workflows/dashboard.yml"
      - ".github/dependabot.yml"
  push:
    branches:
      - main
    paths:
      - "web/observer-ui/**"
      - "api/**"
      - "schemas/**"
      - "specs/004-reusable-dashboard/**"
      - ".github/workflows/dashboard.yml"
      - ".github/dependabot.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web/observer-ui
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.22.3"
          cache: npm
          cache-dependency-path: web/observer-ui/package-lock.json
      - name: Install pinned dependencies
        run: npm ci
      - name: Verify dashboard package
        run: npm run check
