name: Linux ledger storage pressure

on:
  workflow_dispatch:
  pull_request:
    paths:
      - internal/uploadledger/**
      - internal/uploadstate/**
      - go.mod
      - go.sum
      - .github/workflows/ledger-storage-pressure.yml
  push:
    branches: [main]
    paths:
      - internal/uploadledger/**
      - internal/uploadstate/**
      - go.mod
      - go.sum
      - .github/workflows/ledger-storage-pressure.yml

permissions:
  contents: read

concurrency:
  group: ledger-pressure-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-filesystem-full:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile the synthetic Linux fixture without credentials
        shell: bash
        run: go test -c -o "$RUNNER_TEMP/uploadledger.test" ./internal/uploadledger
      - name: Exercise actual ENOSPC only inside a private bounded mount
        shell: bash
        run: sudo env HLO_LEDGER_PRESSURE=1 "$RUNNER_TEMP/uploadledger.test" -test.run='^TestStoragePressureFixture$' -test.count=3
