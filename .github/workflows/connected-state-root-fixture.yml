name: Connected state root fixture

on:
  pull_request:
    paths:
      - '.github/workflows/connected-state-root-fixture.yml'
      - 'internal/connectedstateroot/**'
      - 'specs/012-connected-observation/installed-state-root.md'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - '.github/workflows/connected-state-root-fixture.yml'
      - 'internal/connectedstateroot/**'
      - 'specs/012-connected-observation/installed-state-root.md'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: connected-state-root-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-state-root:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile synthetic state-root fixture
        run: go test -c ./internal/connectedstateroot -o "$RUNNER_TEMP/connected-state-root.test"
      - name: Prove root-owned creation and recovery refusals
        run: >-
          sudo env -i PATH=/usr/bin:/bin TMPDIR=/tmp OBSERVER_CONNECTED_STATE_ROOT_ACCEPTANCE=1
          "$RUNNER_TEMP/connected-state-root.test"
          -test.run='^TestOwnedStateRootFixture$' -test.count=1 -test.timeout=120s -test.v
