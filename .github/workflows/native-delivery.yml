name: Native delivery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-delivery-${{ github.ref }}
  cancel-in-progress: true

env:
  PREVIEW_VERSION: 0.1.0-preview.1
  GOFLAGS: -buildvcs=false

jobs:
  cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate release contracts and workflow scripts
        run: |
          npm run test:contracts
          node --test scripts/release-workflow.test.mjs
      - name: Cross-build the six preview binaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/binaries
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            platform="${target%/*}"
            architecture="${target#*/}"
            suffix=""
            if [[ "$platform" == "windows" ]]; then suffix=".exe"; fi
            CGO_ENABLED=0 GOOS="$platform" GOARCH="$architecture" go build \
              -trimpath \
              -ldflags "-s -w -buildid= -X main.version=${PREVIEW_VERSION} -X main.commit=${GITHUB_SHA}" \
              -o "dist/binaries/observer_${platform}_${architecture}${suffix}" \
              ./cmd/observer
          done
      - name: Create deterministic native archives and manifest
        run: go run ./cmd/releasepack --version "$PREVIEW_VERSION" --commit "$GITHUB_SHA" --binaries dist/binaries --output dist/release --resources packaging/resources
      - name: Generate SPDX dependency SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          syft-version: v1.51.1
          format: spdx-json
          output-file: dist/release/observer.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Add offline installers and checksum the final bytes
        shell: bash
        run: |
          set -euo pipefail
          cp packaging/install.sh dist/release/install.sh
          cp packaging/install.ps1 dist/release/install.ps1
          node scripts/release-finalize.mjs --version "$PREVIEW_VERSION" --commit "$GITHUB_SHA" --directory dist/release --schema schemas/release-v1.schema.json
          node scripts/smoke-native-delivery.mjs --mode bundle --version "$PREVIEW_VERSION" --directory dist/release
      - name: Upload bounded preview fixture
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: native-preview-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  native-smoke:
    needs: cross-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: macos-15-intel
          - runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: native-preview-${{ github.sha }}
          path: dist/release
      - name: Install schema validators for packaged runtime smoke
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test installer lifecycle on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash packaging/tests/install-sh.test.sh
      - name: Test installer lifecycle on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packaging/tests/install-ps1.test.ps1
      - name: Execute the native archive and offline installer
        env:
          OBSERVER_TEST_USER_MANAGER: '1'
        run: node scripts/smoke-native-delivery.mjs --mode native --version "$env:PREVIEW_VERSION" --commit "$env:GITHUB_SHA" --directory dist/release
        if: runner.os == 'Windows'
      - name: Execute the native archive and offline installer
        run: node scripts/smoke-native-delivery.mjs --mode native --version "$PREVIEW_VERSION" --commit "$GITHUB_SHA" --directory dist/release
        if: runner.os != 'Windows'

  vulnerability-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan reachable Go code for known vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@40c09b7dc99638e5ddb0bfd91c1673effc064d8a # v4.8.1
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
