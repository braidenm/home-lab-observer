name: Native delivery

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: native-delivery-${{ github.ref }}
  cancel-in-progress: true

env:
  # Synthetic CI identity; never reuse an immutable public release version.
  PREVIEW_VERSION: 0.1.0-preview.999999
  GOFLAGS: -buildvcs=false

jobs:
  cross-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate release contracts and workflow scripts
        run: |
          npm run test:contracts
          node --test scripts/release-workflow.test.mjs
          node --test scripts/test-missing-linux-runtime.test.mjs
      - name: Cross-build paired native preview binaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir -p dist
          bash scripts/build-native-v2.sh "$PREVIEW_VERSION" "$GITHUB_SHA" dist/binaries
      - name: Create deterministic native archives and manifest
        run: go run ./cmd/releasepack --schema-version observer-release/v2 --version "$PREVIEW_VERSION" --commit "$GITHUB_SHA" --binaries dist/binaries --output dist/release --resources packaging/resources
      - name: Prove packaged core survives missing optional Linux runtime
        run: node scripts/test-missing-linux-runtime.mjs dist/release
      - name: Generate SPDX dependency SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          syft-version: v1.51.1
          format: spdx-json
          output-file: dist/release/observer.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false
      - name: Add offline installers and checksum the final bytes
        shell: bash
        run: |
          set -euo pipefail
          cp packaging/install.sh dist/release/install.sh
          cp packaging/install.ps1 dist/release/install.ps1
          node scripts/release-finalize.mjs --version "$PREVIEW_VERSION" --commit "$GITHUB_SHA" --directory dist/release --schema schemas/release-v2.schema.json
          node scripts/smoke-native-delivery.mjs --mode bundle --version "$PREVIEW_VERSION" --directory dist/release
      - name: Upload bounded preview fixture
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-preview-${{ github.sha }}
          path: dist/release/
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  native-smoke:
    needs: cross-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
          - runner: macos-15-intel
          - runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: native-preview-${{ github.sha }}
          path: dist/release
      - name: Install schema validators for packaged runtime smoke
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test installer lifecycle on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: bash packaging/tests/install-sh.test.sh
      - name: Test installer lifecycle on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          node --test scripts/windows-task-owner-diagnostic.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File packaging/tests/install-ps1.test.ps1
      - name: Execute the native archive and offline installer
        env:
          OBSERVER_TEST_USER_MANAGER: '1'
        run: node scripts/smoke-native-delivery.mjs --mode native --version "$env:PREVIEW_VERSION" --commit "$env:GITHUB_SHA" --directory dist/release
        if: runner.os == 'Windows'
      - name: Execute the native archive and offline installer
        run: node scripts/smoke-native-delivery.mjs --mode native --version "$PREVIEW_VERSION" --commit "$GITHUB_SHA" --directory dist/release
        if: runner.os != 'Windows'

  vulnerability-scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Scan reachable Go code for known vulnerabilities
        shell: bash
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never
