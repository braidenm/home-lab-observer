name: Connected install lease fixture

on:
  pull_request:
    paths:
      - '.github/workflows/connected-install-lease-fixture.yml'
      - 'internal/connectedinstalllease/**'
      - 'specs/012-connected-observation/installed-lease.md'
      - 'go.mod'
      - 'go.sum'
  push:
    branches: [main]
    paths:
      - '.github/workflows/connected-install-lease-fixture.yml'
      - 'internal/connectedinstalllease/**'
      - 'specs/012-connected-observation/installed-lease.md'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

concurrency:
  group: connected-install-lease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-lease:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile synthetic lease fixture
        run: go test -c ./internal/connectedinstalllease -o "$RUNNER_TEMP/connected-install-lease.test"
      - name: Prove root-owned lock and refusals
        run: >-
          sudo env -i PATH=/usr/bin:/bin TMPDIR=/tmp OBSERVER_CONNECTED_LEASE_ACCEPTANCE=1
          "$RUNNER_TEMP/connected-install-lease.test"
          -test.run='^TestOwnedInstallLeaseFixture$' -test.count=1 -test.timeout=120s -test.v
